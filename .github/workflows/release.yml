name: Build & Release Debug APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0 or latest-debug)'
        required: false
        default: 'latest-debug'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
            IS_DRAFT="${{ github.event.inputs.draft }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
            IS_DRAFT="false"
          else
            TAG="latest-debug"
            IS_PRERELEASE="true"
            IS_DRAFT="false"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "draft=${IS_DRAFT}" >> $GITHUB_OUTPUT

          mkdir -p dist
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="dist/fileMatrix-${TAG}.apk"
          cp "$APK_SRC" "$APK_DEST"

          cd dist
          sha256sum "fileMatrix-${TAG}.apk" > "fileMatrix-${TAG}.apk.sha256"
          echo "Generated APK: $APK_DEST"
          cat "fileMatrix-${TAG}.apk.sha256"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fileMatrix-${{ steps.prep.outputs.tag }}
          path: dist/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: fileMatrix ${{ steps.prep.outputs.tag }}
          draft: ${{ steps.prep.outputs.draft == 'true' }}
          prerelease: ${{ steps.prep.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
